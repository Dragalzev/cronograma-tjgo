<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma de Estudos — TJGO</title>
<style>
  :root {
    --navy: #16324f; --maroon: #8a1f2d; --gold: #c9a34e;
    --bg: #f7f5f0; --card: #ffffff; --border: #e0dcd0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: #222; margin: 0; padding: 0;
  }
  header {
    background: var(--navy); color: white; padding: 18px 24px;
    position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  nav.tabs { display: flex; gap: 4px; margin-top: 12px; }
  nav.tabs button {
    background: rgba(255,255,255,.12); border: none; color: white; padding: 8px 16px;
    border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  nav.tabs button.active { background: var(--bg); color: var(--navy); }
  .undo-btn {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: white;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    margin-top: 10px;
  }
  .undo-btn:hover { background: rgba(255,255,255,.22); }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
  .view { display: none; }
  .view.active { display: block; }

  .info-box {
    background: #fff; border-left: 4px solid var(--maroon); padding: 12px 16px;
    margin-bottom: 18px; font-size: 13px; border-radius: 4px; line-height: 1.5;
  }
  .progress-summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .progress-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; min-width: 110px;
  }
  .progress-chip b { display: block; color: var(--navy); font-size: 15px; }

  .week-block { margin-bottom: 22px; }
  .week-header {
    background: #e8e2d4; color: var(--navy); font-weight: 700; padding: 6px 12px;
    border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .day-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  .day-card.today { border-color: var(--maroon); box-shadow: 0 0 0 2px rgba(138,31,45,.15); }
  .day-head {
    background: #fbf9f4; padding: 6px 12px; font-weight: 700; color: var(--maroon);
    font-size: 12.5px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);
  }
  .item-row { padding: 10px 12px; border-bottom: 1px solid #f0ede4; }
  .item-row:last-child { border-bottom: none; }
  .item-row.done { background: #f3f8f2; }
  .item-row.review-row { background: #fbf6ea; }
  .item-row.leiseca-row { background: #f4f1ea; }
  .item-materia .ltag {
    background: var(--gold); color: #3a2c00; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 6px; vertical-align: middle;
  }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .item-materia { font-weight: 700; color: var(--navy); font-size: 13px; }
  .item-materia .rtag {
    background: var(--maroon); color: white; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 6px; vertical-align: middle;
  }
  .item-desc { font-size: 12.5px; margin-top: 3px; color: #333; }
  .badge-inc {
    background: #e4edf3; color: var(--navy); font-size: 10px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 4px; white-space: nowrap;
  }
  .badge-lei {
    background: #f4f1ea; border-left: 3px solid var(--maroon); font-size: 10.5px; color: #5a4632;
    padding: 4px 8px; margin-top: 5px; border-radius: 3px;
  }
  .badge-lei b { color: var(--maroon); }
  .rev-piece { font-size: 11.5px; color: #444; margin-top: 3px; }
  .rev-piece .rtag2 {
    background: var(--gold); color: #3a2c00; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-right: 4px;
  }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .actions button {
    border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 9px;
    font-size: 11px; cursor: pointer; font-weight: 600;
  }
  .actions button.done-btn.active { background: #2e7d32; color: white; border-color: #2e7d32; }
  .actions button.skip-btn.active { background: var(--maroon); color: white; border-color: var(--maroon); }

  .stats-form { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; align-items: flex-end; }
  .stats-form label { font-size: 10.5px; color: #666; display: flex; flex-direction: column; gap: 2px; }
  .stats-form input {
    width: 64px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
  }
  .stats-form .pct-auto {
    width: 64px; padding: 4px 6px; border: 1px dashed var(--border); border-radius: 4px; font-size: 12px;
    background: #f6f4ee; color: #555; text-align: center;
  }
  .stats-form .lei-box {
    flex-basis: 100%; background: #f4f1ea; border-left: 3px solid var(--maroon); font-size: 10.5px;
    color: #5a4632; padding: 5px 8px; border-radius: 3px; margin-top: 2px;
  }
  .stats-form .lei-box b { color: var(--maroon); }

  .empty-day { padding: 14px; font-size: 12px; font-style: italic; color: #999; }

  /* aba questoes & flashcards */
  .subject-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 16px; overflow: hidden;
  }
  .subject-head {
    background: var(--navy); color: white; padding: 8px 14px; font-weight: 700; font-size: 13.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .subject-head .cnt { font-weight: 400; font-size: 11px; opacity: .85; }
  .topic-row {
    padding: 9px 14px; border-bottom: 1px solid #f0ede4; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px; flex-wrap: wrap;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row .tlabel { font-size: 12.5px; font-weight: 600; color: #333; flex: 1; min-width: 160px; }
  .topic-row .tlabel .badge-inc { margin-left: 6px; }

  /* aba revisao */
  .rev-list-item {
    background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--maroon);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px;
  }
  .rev-list-item.ok { border-left-color: #2e7d32; opacity: .75; }
  .rev-list-item .rtitle { font-weight: 700; color: var(--navy); font-size: 13.5px; }
  .rev-list-item .rmeta { font-size: 11px; color: #666; margin-top: 2px; }
  .rev-list-item .rbar { height: 6px; border-radius: 3px; background: #eee; margin-top: 6px; overflow: hidden; }
  .rev-list-item .rbar-fill { height: 100%; background: var(--maroon); }
  .rev-list-item.ok .rbar-fill { background: #2e7d32; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--navy); margin: 22px 0 8px; }
  .small-note { font-size: 11.5px; color: #777; margin-bottom: 10px; }

  table.simple { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
  table.simple th { background: var(--navy); color: white; text-align: left; padding: 5px 8px; font-size: 11px; }
  table.simple td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  table.simple tr:nth-child(even) td { background: #faf8f3; }

  .footer-note { text-align: center; font-size: 11px; color: #999; margin-top: 30px; }
  .reset-btn {
    background: none; border: 1px solid var(--border); color: #999; font-size: 10px;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Cronograma de Estudos — TJGO</h1>
  <div class="sub" id="header-sub"></div>

    <button id="tab-btn-cronograma" class="active" onclick="showTab('cronograma')">Cronograma</button>

    <button id="tab-btn-lei" onclick="showTab('lei')">Lei Seca</button>
    <button id="tab-btn-revisao" onclick="showTab('revisao')">Pontos de revisão</button>
  </nav>
  <button class="undo-btn" onclick="undoLast()" title="Desfaz o último clique em Estudei/Não estudei/Revisei/Não revisei/Li/Não li">&#8630; Desfazer última ação</button>
</header>

<main>
  <div id="view-cronograma" class="view active"></div>
  <div id="view-questoes" class="view"></div>
  <div id="view-lei" class="view"></div>
  <div id="view-revisao" class="view"></div>
  <div class="footer-note">
    Progresso sincronizado na nuvem (Firebase) — funciona em qualquer aparelho.
    <span id="sync-status" style="margin-left:6px;"></span>
    <button class="reset-btn" onclick="resetAll()">Zerar progresso salvo</button>
  </div>
</main>

<script>
const DATA = JSON.parse(document.getElementById('tracker-data-json').textContent);
const DAYS = DATA.days;
const TOPICS = DATA.topics_registry;

// dias extras sao gerados sob demanda se um item precisar ser adiado alem do fim do
// calendario original — nunca "perdemos" um item, so criamos mais um dia pra ele.
let EXTENDED_DAYS = DAYS.slice();
const WEEK_DAY_NAMES = ['Sábado', 'Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
const CAL_START = new Date(2026, 7, 8); // 08/08/2026, dia 0 do calendario (mesma base do gerador)

function ensureDay(idx) {
  while (EXTENDED_DAYS.length <= idx) {
    const i = EXTENDED_DAYS.length;
    const d = new Date(CAL_START.getTime());
    d.setDate(d.getDate() + i);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const ref = EXTENDED_DAYS[i - 1] || { leitura_min: 0, questoes_min: 0 };
    EXTENDED_DAYS.push({
      semana: null, semana_abs: null, dia_nome: WEEK_DAY_NAMES[i % 7], data: dd + '/' + mm,
      is_extra_week: true, leitura_min: ref.leitura_min, questoes_min: ref.questoes_min,
      study_items: [], review_native: [], lei_seca_native: [],
    });
  }
}

// ---------- estado persistido ----------
// doneIds: array de ids marcados como "estudado" (travados no dia em que caem)
// skipCount: {itemId: numero de vezes que "nao estudei" foi clicado} — cada clique
//   empurra o item para o dia seguinte (e, em cascata, pode empurrar outro item que
//   estava naquele dia). NAO e um estado persistente tipo "sempre pulado": e um
//   contador de quantas vezes ele ja deve ter sido adiado ate finalmente aparecer.
const LS_KEY_DONE = 'tjgo_done_ids_v2';
const LS_KEY_SKIP = 'tjgo_skip_count_v2';
const LS_KEY_REVDONE = 'tjgo_rev_done_ids_v2';
const LS_KEY_REVSKIP = 'tjgo_rev_skip_count_v2';
const LS_KEY_LEIDONE = 'tjgo_lei_done_ids_v1';
const LS_KEY_LEISKIP = 'tjgo_lei_skip_count_v1';
// {topicKey: {questoesFeitas, questoesAcertos, pctFlash, leiSecaFlashFeitos, leiSecaFlashAcertos}}
const LS_KEY_TOPICSTATS = 'tjgo_topic_stats_v2';

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function saveLS(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ============================================================
// SINCRONIZACAO NA NUVEM (Firebase Realtime Database, via REST — sem SDK)
// localStorage continua sendo usado como cache local instantaneo (funciona offline),
// mas o Firebase e a fonte de verdade compartilhada entre aparelhos.
// ============================================================
const FIREBASE_DB_URL = 'https://cronograma-tjgo-default-rtdb.firebaseio.com';
const SYNC_PATH = 'progress/tjgo_gabriel'; // caminho fixo dentro do seu banco
const SYNC_URL = FIREBASE_DB_URL + '/' + SYNC_PATH + '.json';

let syncTimer = null;
let syncing = false;

function setSyncStatus(text) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = text;
}

function collectState() {
  return {
    doneIds: Array.from(doneIds), skipCount, revDoneIds: Array.from(revDoneIds), revSkipCount,
    leiDoneIds: Array.from(leiDoneIds), leiSkipCount, topicStats, updatedAt: Date.now(),
  };
}

function applyState(state) {
  if (!state) return;
  doneIds = new Set(state.doneIds || []);
  skipCount = state.skipCount || {};
  revDoneIds = new Set(state.revDoneIds || []);
  revSkipCount = state.revSkipCount || {};
  leiDoneIds = new Set(state.leiDoneIds || []);
  leiSkipCount = state.leiSkipCount || {};
  topicStats = state.topicStats || {};
  saveLS(LS_KEY_DONE, Array.from(doneIds));
  saveLS(LS_KEY_SKIP, skipCount);
  saveLS(LS_KEY_REVDONE, Array.from(revDoneIds));
  saveLS(LS_KEY_REVSKIP, revSkipCount);
  saveLS(LS_KEY_LEIDONE, Array.from(leiDoneIds));
  saveLS(LS_KEY_LEISKIP, leiSkipCount);
  saveLS(LS_KEY_TOPICSTATS, topicStats);
}

function scheduleCloudSync() {
  setSyncStatus('salvando…');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 700);
}

function pushToCloud() {
  syncing = true;
  fetch(SYNC_URL, { method: 'PUT', body: JSON.stringify(collectState()) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); setSyncStatus('sincronizado ✓'); })
    .catch(() => setSyncStatus('sem conexão — salvo só neste aparelho'))
    .finally(() => { syncing = false; });
}

function pullFromCloud() {
  setSyncStatus('carregando da nuvem…');
  return fetch(SYNC_URL)
    .then(r => r.ok ? r.json() : null)
    .then(remote => {
      if (remote) applyState(remote);
      setSyncStatus('sincronizado ✓');
    })
    .catch(() => setSyncStatus('sem conexão — usando dados salvos neste aparelho'));
}

let doneIds = new Set(loadLS(LS_KEY_DONE, []));
let skipCount = loadLS(LS_KEY_SKIP, {});
let revDoneIds = new Set(loadLS(LS_KEY_REVDONE, []));
let revSkipCount = loadLS(LS_KEY_REVSKIP, {});
let leiDoneIds = new Set(loadLS(LS_KEY_LEIDONE, []));
let leiSkipCount = loadLS(LS_KEY_LEISKIP, {});
let topicStats = loadLS(LS_KEY_TOPICSTATS, {});
// migracao leve: v1 tinha {questoes, pctQuestoes, pctFlash} -> v2 usa questoesFeitas/questoesAcertos
(function migrateStats() {
  const old = loadLS('tjgo_topic_stats_v1', null);
  if (old && Object.keys(topicStats).length === 0) {
    for (const k in old) {
      topicStats[k] = { questoesFeitas: old[k].questoes ?? null, questoesAcertos: null, pctFlash: old[k].pctFlash ?? null, leiSecaFlashAcertos: null };
    }
    saveLS(LS_KEY_TOPICSTATS, topicStats);
  }
})();

function persistStudy() {
  saveLS(LS_KEY_DONE, Array.from(doneIds));
  saveLS(LS_KEY_SKIP, skipCount);
  scheduleCloudSync();
}
function persistReview() {
  saveLS(LS_KEY_REVDONE, Array.from(revDoneIds));
  saveLS(LS_KEY_REVSKIP, revSkipCount);
  scheduleCloudSync();
}
function persistLei() {
  saveLS(LS_KEY_LEIDONE, Array.from(leiDoneIds));
  saveLS(LS_KEY_LEISKIP, leiSkipCount);
  scheduleCloudSync();
}

function resetAll() {
  if (!confirm('Isso apaga todo o progresso marcado e as estatísticas salvas neste navegador E na nuvem, em todos os aparelhos. Confirmar?')) return;
  localStorage.removeItem(LS_KEY_DONE);
  localStorage.removeItem(LS_KEY_SKIP);
  localStorage.removeItem(LS_KEY_REVDONE);
  localStorage.removeItem(LS_KEY_REVSKIP);
  localStorage.removeItem(LS_KEY_LEIDONE);
  localStorage.removeItem(LS_KEY_LEISKIP);
  localStorage.removeItem(LS_KEY_TOPICSTATS);
  doneIds = new Set(); skipCount = {}; revDoneIds = new Set(); revSkipCount = {};
  leiDoneIds = new Set(); leiSkipCount = {}; topicStats = {};
  undoStack = [];
  scheduleCloudSync();
  renderAll();
}

// ============================================================
// DESFAZER — pilha das ultimas acoes de check/skip, para reverter cliques errados
// sem precisar caçar o item no dia para onde ele foi empurrado.
// ============================================================
let undoStack = [];
function pushUndo(entry) {
  undoStack.push(entry);
  if (undoStack.length > 50) undoStack.shift();
}
function undoLast() {
  const last = undoStack.pop();
  if (!last) { alert('Não há nenhuma ação para desfazer.'); return; }
  const set = last.track === true ? revDoneIds : last.track === 'lei' ? leiDoneIds : doneIds;
  const map = last.track === true ? revSkipCount : last.track === 'lei' ? leiSkipCount : skipCount;
  if (last.kind === 'done') {
    if (set.has(last.id)) set.delete(last.id); else set.add(last.id);
  } else {
    map[last.id] = Math.max(0, (map[last.id] || 0) - 1);
  }
  if (last.track === true) persistReview(); else if (last.track === 'lei') persistLei(); else persistStudy();
  renderAll();
}

// ============================================================
// SIMULACAO DE REAGENDAMENTO (esteira / fila por dia, com "credito" de adiamento)
// capacidade: 2 vagas de estudo por dia, 1 vaga de revisao por dia.
// - itens marcados "estudei/revisei/li" ficam travados no dia em que efetivamente
//   pousam apos o adiamento (sempre exibidos ali, sem disputar cota) — MAS eles ainda
//   respeitam os creditos de adiamento pendentes antes disso, entao um item que foi
//   empurrado pra frente com "nao estudei" e so DEPOIS marcado como feito continua no
//   dia pra onde foi empurrado, nao volta pro dia original.
// - cada clique em "nao estudei/nao revisei/nao li" soma 1 ao contador de adiamentos
//   daquele item; a simulacao "cobra" esse credito UMA vez por dia ate zerar, so entao
//   o item volta a disputar vaga normalmente (podendo empurrar outro item pra frente).
// - se a fila nunca couber nos dias originais do calendario, dias extras sao criados
//   sob demanda (ensureDay) — nenhum item se perde no fim do calendario.
// ============================================================
function simulateTrack(itemsSource, doneSet, skipCountMap, capacity) {
  const getItems = typeof itemsSource === 'function' ? itemsSource : (day => day[itemsSource]);
  let carry = [];
  const runtimeDeferred = {};
  const dayResults = [];
  const SAFETY_EXTRA_DAYS = 500; // evita loop infinito em algum cenario patologico
  let i = 0;
  while (i < DAYS.length || carry.length > 0) {
    if (i >= DAYS.length + SAFETY_EXTRA_DAYS) break;
    ensureDay(i);
    const day = EXTENDED_DAYS[i];
    const pool = carry.concat(getItems(day));

    // 1) aplica o credito de adiamento pendente a TODOS os itens (feitos ou nao) —
    //    so depois disso decidimos quem esta "feito" no dia em que realmente pousou.
    const landedToday = [];
    const deferredToday = [];
    for (const it of pool) {
      const sc = skipCountMap[it.id] || 0;
      const rd = runtimeDeferred[it.id] || 0;
      if (rd < sc) {
        runtimeDeferred[it.id] = rd + 1;
        deferredToday.push(it);
      } else {
        landedToday.push(it);
      }
    }

    // 2) dos itens que pousaram hoje, os ja marcados como feitos sempre aparecem
    //    (nao contam pra cota); os demais disputam a cota restante do dia.
    const doneItems = landedToday.filter(it => doneSet.has(it.id));
    const others = landedToday.filter(it => !doneSet.has(it.id));
    const remainingCap = Math.max(0, capacity - doneItems.length);
    const accepted = others.slice(0, remainingCap);
    const overflow = others.slice(remainingCap);

    const shown = doneItems.concat(accepted);
    shown.sort((a, b) => pool.indexOf(a) - pool.indexOf(b));
    dayResults.push(shown);
    carry = deferredToday.concat(overflow);
    i++;
  }
  return dayResults; // array paralelo aos dias (originais + extras criados), cada elemento = itens exibidos naquele dia
}

// Estudo e lei seca disputam a MESMA cota de 2 vagas/dia (lei seca nao soma, ela ocupa
// o lugar da materia naquele slot) — por isso rodam numa unica simulacao combinada.
// Revisao continua com cota propria de 1/dia, separada.
function getSimulated() {
  const mergedDone = new Set([...doneIds, ...leiDoneIds]);
  const mergedSkip = Object.assign({}, skipCount, leiSkipCount);
  const combinedByDay = simulateTrack(
    day => day.study_items.concat(day.lei_seca_native), mergedDone, mergedSkip, 2
  );
  const revByDay = simulateTrack('review_native', revDoneIds, revSkipCount, 1);
  const studyByDay = combinedByDay.map(list => list.filter(it => it.id[0] !== 'l'));
  const leiByDay = combinedByDay.map(list => list.filter(it => it.id[0] === 'l'));
  return { studyByDay, revByDay, leiByDay };
}

// ============================================================
// RENDER — aba Cronograma
// ============================================================
const REV_LABEL = {'última sessão': 'D-recente', '~1 semana': 'D+7', '~1 mês': 'D+30', 'conteúdo já concluído': 'ciclo'};

function todayStr() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '/' + mm;
}

function onStatInput(topicKey, inputEl) {
  const field = inputEl.getAttribute('data-field');
  const val = inputEl.value === '' ? null : Number(inputEl.value);
  if (!topicStats[topicKey]) topicStats[topicKey] = {};
  topicStats[topicKey][field] = val;
  saveLS(LS_KEY_TOPICSTATS, topicStats);
  scheduleCloudSync();
  // sincroniza outros inputs do mesmo topico (em outros dias) sem re-renderizar tudo
  document.querySelectorAll('[data-topic="' + CSS.escape(topicKey) + '"] input[data-field="' + field + '"]').forEach(el => {
    if (el !== inputEl) el.value = val === null ? '' : val;
  });
  // atualiza o % automatico correspondente (questoes ou lei seca, sao caixas separadas)
  const s = topicStats[topicKey];
  if (field === 'questoesFeitas' || field === 'questoesAcertos') {
    const pct = (s.questoesFeitas && s.questoesAcertos !== null && s.questoesAcertos !== undefined && s.questoesFeitas > 0)
      ? Math.round((s.questoesAcertos / s.questoesFeitas) * 1000) / 10 : null;
    document.querySelectorAll('[data-topic="' + CSS.escape(topicKey) + '"][data-kind="questoes"] .pct-auto').forEach(el => {
      el.textContent = pct === null ? '—' : pct + '%';
    });
  } else if (field === 'leiSecaFlashFeitos' || field === 'leiSecaFlashAcertos') {
    const pct = (s.leiSecaFlashFeitos && s.leiSecaFlashAcertos !== null && s.leiSecaFlashAcertos !== undefined && s.leiSecaFlashFeitos > 0)
      ? Math.round((s.leiSecaFlashAcertos / s.leiSecaFlashFeitos) * 1000) / 10 : null;
    document.querySelectorAll('[data-topic="' + CSS.escape(topicKey) + '"][data-kind="lei"] .pct-auto').forEach(el => {
      el.textContent = pct === null ? '—' : pct + '%';
    });
  }
  renderRevisaoTab(); // atualiza a aba de prioridades em segundo plano
}

function studyItemHtml(day, item) {
  const isDone = doneIds.has(item.id);
  const doneCls = isDone ? ' done' : '';
  let incHtml = '';
  if (item.incidencia) {
    incHtml = '<span class="badge-inc">&#9733; ' + item.incidencia.pct + '% (' + item.incidencia.assunto + ')</span>';
  }
  const minTxt = item.minutos ? ' <span style="font-weight:400;color:#888;font-size:10px;">(' + fmtH(item.minutos) + ')</span>' : '';
  return '<div class="item-row' + doneCls + '">' +
    '<div class="item-top">' +
      '<div>' +
        '<span class="item-materia">' + item.materia + minTxt + '</span>' +
        '<div class="item-desc">' + item.desc + incHtml + '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="done-btn' + (isDone ? ' active' : '') + '" onclick="toggleDone(\'' + item.id + '\',false)">&#10003; Estudei</button>' +
        '<button class="skip-btn" onclick="bumpSkip(\'' + item.id + '\',false)" title="Adia esta matéria para o próximo dia">&#10007; Não estudei</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function reviewItemHtml(item) {
  const isDone = revDoneIds.has(item.id);
  const doneCls = isDone ? ' done' : '';
  const pieces = item.revs.map(r => {
    const tag = REV_LABEL[r.tipo] || r.tipo;
    return '<div class="rev-piece"><span class="rtag2">' + tag + '</span>' + r.desc + '</div>';
  }).join('');
  return '<div class="item-row review-row' + doneCls + '">' +
    '<div class="item-top">' +
      '<div>' +
        '<span class="item-materia">' + item.materia + '<span class="rtag">revisão</span></span>' +
        pieces +
      '</div>' +
      '<div class="actions">' +
        '<button class="done-btn' + (isDone ? ' active' : '') + '" onclick="toggleDone(\'' + item.id + '\',true)">&#10003; Revisei</button>' +
        '<button class="skip-btn" onclick="bumpSkip(\'' + item.id + '\',true)" title="Adia esta revisão para o próximo dia">&#10007; Não revisei</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function leiSecaItemHtml(item) {
  const isDone = leiDoneIds.has(item.id);
  const doneCls = isDone ? ' done' : '';
  const leiTxt = item.lei_seca ? item.lei_seca : '(sem lei seca mapeada para este assunto)';
  return '<div class="item-row leiseca-row' + doneCls + '">' +
    '<div class="item-top">' +
      '<div>' +
        '<span class="item-materia">' + item.materia + '<span class="ltag">lei seca</span></span>' +
        '<div class="item-desc">' + item.assunto + '</div>' +
        '<div class="badge-lei"><b>LEI SECA</b> ' + leiTxt + '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="done-btn' + (isDone ? ' active' : '') + '" onclick="toggleDone(\'' + item.id + '\',\'lei\')">&#10003; Li</button>' +
        '<button class="skip-btn" onclick="bumpSkip(\'' + item.id + '\',\'lei\')" title="Adia esta leitura de lei seca para o próximo dia">&#10007; Não li</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function fmtH(mins) {
  mins = Math.round(mins);
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h && m) return h + 'h' + String(m).padStart(2, '0');
  return h ? h + 'h' : m + 'min';
}

function toggleDone(id, track) {
  const set = track === true ? revDoneIds : track === 'lei' ? leiDoneIds : doneIds;
  if (set.has(id)) set.delete(id); else set.add(id);
  pushUndo({ kind: 'done', track, id });
  if (track === true) persistReview(); else if (track === 'lei') persistLei(); else persistStudy();
  renderAll();
}

function bumpSkip(id, track) {
  const map = track === true ? revSkipCount : track === 'lei' ? leiSkipCount : skipCount;
  map[id] = (map[id] || 0) + 1;
  pushUndo({ kind: 'skip', track, id });
  if (track === true) persistReview(); else if (track === 'lei') persistLei(); else persistStudy();
  renderAll();
}

function renderCronogramaTab() {
  const { studyByDay, revByDay, leiByDay } = getSimulated();
  const today = todayStr();
  let html = '';
  // as 3 trilhas podem ter se estendido por quantidades diferentes de dias extras —
  // usamos o maior comprimento e EXTENDED_DAYS (ja populado pela simulacao) pra cobrir tudo.
  const totalDays = Math.max(studyByDay.length, revByDay.length, leiByDay.length);

  for (let idx = 0; idx < totalDays; idx++) {
    ensureDay(idx);
    const day = EXTENDED_DAYS[idx];
    const studyItems = studyByDay[idx] || [];
    const revItems = revByDay[idx] || [];
    const leiItems = leiByDay[idx] || [];
    const isToday = day.data === today;
    let body = '';
    if (studyItems.length === 0 && revItems.length === 0 && leiItems.length === 0) {
      body = '<div class="empty-day">Sem sessão neste dia</div>';
    } else {
      studyItems.forEach(it => { body += studyItemHtml(day, it); });
      revItems.forEach(it => { body += reviewItemHtml(it); });
      leiItems.forEach(it => { body += leiSecaItemHtml(it); });
    }
    html += '<div class="day-card' + (isToday ? ' today' : '') + '">' +
      '<div class="day-head"><span>' + day.dia_nome + ' — ' + day.data + (isToday ? ' (hoje)' : '') + '</span>' +
      '<span style="font-weight:400;">Leitura ' + fmtH(day.leitura_min) + ' · Questões ' + fmtH(day.questoes_min) + '</span></div>' +
      body + '</div>';
  }
  document.getElementById('view-cronograma').innerHTML = html;
}

// ============================================================
// RENDER — aba Questões & Flashcards (todas as materias das pastas, por topico)
// ============================================================
function findLeiSecaForTopic(key) {
  for (const day of DAYS) {
    for (const it of day.lei_seca_native) {
      if (it.topic_key === key) return it.lei_seca;
    }
    for (const it of day.study_items) {
      if (it.topic_key === key && it.lei_seca) return it.lei_seca;
    }
  }
  return null;
}

function topicRowHtml(key, t) {
  const incHtml = t.alta_incidencia
    ? '<span class="badge-inc">&#9733; ' + t.pct + '%</span>'
    : '<span class="badge-inc" style="background:#eee;color:#777;">padrão</span>';
  const s = topicStats[key] || {};
  const esc = key.replace(/"/g, '&quot;');
  const escJs = esc.replace(/'/g, "\\'");
  const pctAuto = (s.questoesFeitas && s.questoesAcertos !== null && s.questoesAcertos !== undefined && s.questoesFeitas > 0)
    ? (Math.round((s.questoesAcertos / s.questoesFeitas) * 1000) / 10) + '%' : '—';
  return '<div class="topic-row">' +
    '<div class="tlabel">' + t.label + incHtml + '</div>' +
    '<div class="stats-form" data-topic="' + esc + '" data-kind="questoes">' +
      '<label>Questões feitas<input type="number" min="0" data-field="questoesFeitas" value="' + (s.questoesFeitas ?? '') + '" oninput="onStatInput(\'' + escJs + '\', this)"></label>' +
      '<label>Quantidade de acertos<input type="number" min="0" data-field="questoesAcertos" value="' + (s.questoesAcertos ?? '') + '" oninput="onStatInput(\'' + escJs + '\', this)"></label>' +
      '<label>Porcentagem de acertos<span class="pct-auto">' + pctAuto + '</span></label>' +
      '<label>% acerto flashcards<input type="number" min="0" max="100" data-field="pctFlash" value="' + (s.pctFlash ?? '') + '" oninput="onStatInput(\'' + escJs + '\', this)"></label>' +
    '</div>' +
  '</div>';
}

function renderQuestoesTab() {
  // agrupa os topicos por materia, na mesma ordem de incidencia geral da tabela de prioridades
  const materiaOrder = DATA.subject_incidence_table.map(r => r.materia);
  const byMateria = {};
  for (const key in TOPICS) {
    const t = TOPICS[key];
    if (!byMateria[t.materia]) byMateria[t.materia] = [];
    byMateria[t.materia].push([key, t]);
  }
  for (const m in byMateria) {
    byMateria[m].sort((a, b) => {
      const ta = a[1], tb = b[1];
      if (ta.alta_incidencia !== tb.alta_incidencia) return ta.alta_incidencia ? -1 : 1;
      if (ta.alta_incidencia) return (tb.pct || 0) - (ta.pct || 0);
      return ta.label.localeCompare(tb.label, 'pt-BR');
    });
  }
  const materias = Object.keys(byMateria).sort((a, b) => {
    const ia = materiaOrder.indexOf(a), ib = materiaOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  let html = '<div class="info-box">' +
    'Lance aqui as suas estatísticas de questões e flashcards, organizadas por matéria e tópico — ' +
    'cobre todas as matérias das suas pastas. A porcentagem de acertos das questões é calculada ' +
    'automaticamente a partir de "questões feitas" e "quantidade de acertos". A lei seca de cada ' +
    'tópico aparece como referência (preenchida por pesquisa, não editável) e também surge como uma ' +
    'sessão própria no Cronograma assim que você termina os PDFs daquele assunto. Tudo aqui alimenta ' +
    'a aba Pontos de revisão.' +
    '</div>';

  materias.forEach(materia => {
    const topics = byMateria[materia];
    html += '<div class="subject-card">' +
      '<div class="subject-head"><span>' + materia + '</span><span class="cnt">' + topics.length + ' tópicos</span></div>';
    topics.forEach(([key, t]) => { html += topicRowHtml(key, t); });
    html += '</div>';
  });

  document.getElementById('view-questoes').innerHTML = html;
}

// ============================================================
// RENDER — aba Lei Seca (flashcards de lei seca, so para topicos com lei seca mapeada)
// ============================================================
function leiTopicRowHtml(key, t, leiTxt) {
  const s = topicStats[key] || {};
  const esc = key.replace(/"/g, '&quot;');
  const escJs = esc.replace(/'/g, "\\'");
  const pctAuto = (s.leiSecaFlashFeitos && s.leiSecaFlashAcertos !== null && s.leiSecaFlashAcertos !== undefined && s.leiSecaFlashFeitos > 0)
    ? (Math.round((s.leiSecaFlashAcertos / s.leiSecaFlashFeitos) * 1000) / 10) + '%' : '—';
  return '<div class="topic-row">' +
    '<div class="tlabel">' + t.label +
      (t.alta_incidencia ? '<span class="badge-inc">&#9733; ' + t.pct + '%</span>' : '') +
      '<div class="lei-box"><b>LEI SECA</b> ' + leiTxt + '</div>' +
    '</div>' +
    '<div class="stats-form" data-topic="' + esc + '" data-kind="lei">' +
      '<label>Flashcards feitos<input type="number" min="0" data-field="leiSecaFlashFeitos" value="' + (s.leiSecaFlashFeitos ?? '') + '" oninput="onStatInput(\'' + escJs + '\', this)"></label>' +
      '<label>Quantidade de acertos<input type="number" min="0" data-field="leiSecaFlashAcertos" value="' + (s.leiSecaFlashAcertos ?? '') + '" oninput="onStatInput(\'' + escJs + '\', this)"></label>' +
      '<label>Porcentagem de acertos<span class="pct-auto">' + pctAuto + '</span></label>' +
    '</div>' +
  '</div>';
}

function renderLeiSecaTab() {
  const materiaOrder = DATA.subject_incidence_table.map(r => r.materia);
  const byMateria = {};
  for (const key in TOPICS) {
    const t = TOPICS[key];
    const lei = findLeiSecaForTopic(key);
    if (!lei) continue; // so entram topicos com lei seca mapeada
    if (!byMateria[t.materia]) byMateria[t.materia] = [];
    byMateria[t.materia].push([key, t, lei]);
  }
  for (const m in byMateria) {
    byMateria[m].sort((a, b) => (b[1].pct || 0) - (a[1].pct || 0));
  }
  const materias = Object.keys(byMateria).sort((a, b) => {
    const ia = materiaOrder.indexOf(a), ib = materiaOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  let html = '<div class="info-box">' +
    'Flashcards de lei seca, por assunto. O texto de referência é preenchido por pesquisa (não editável); ' +
    'lance aqui a quantidade de flashcards feitos e de acertos — a porcentagem é calculada automaticamente. ' +
    'Essas sessões também aparecem no Cronograma assim que você termina de ler os PDFs de cada assunto.' +
    '</div>';

  if (materias.length === 0) {
    html += '<div class="small-note">Nenhum tópico com lei seca mapeada ainda.</div>';
  }

  materias.forEach(materia => {
    const topics = byMateria[materia];
    html += '<div class="subject-card">' +
      '<div class="subject-head"><span>' + materia + '</span><span class="cnt">' + topics.length + ' tópicos</span></div>';
    topics.forEach(([key, t, lei]) => { html += leiTopicRowHtml(key, t, lei); });
    html += '</div>';
  });

  document.getElementById('view-lei').innerHTML = html;
}

// ============================================================
// RENDER — aba Pontos de revisão
// ============================================================
function buildRevisaoRows(kind) {
  // kind: 'assunto' (questoes+flashcards do PDF) ou 'lei' (flashcards de lei seca)
  const rows = [];
  for (const key in TOPICS) {
    const t = TOPICS[key];
    const s = topicStats[key];
    if (!s) continue;
    let avg = null;
    if (kind === 'assunto') {
      const vals = [];
      const pctQuestoes = (s.questoesFeitas && s.questoesAcertos !== null && s.questoesAcertos !== undefined && s.questoesFeitas > 0)
        ? (s.questoesAcertos / s.questoesFeitas) * 100 : null;
      if (pctQuestoes !== null) vals.push(pctQuestoes);
      if (s.pctFlash !== null && s.pctFlash !== undefined && s.pctFlash !== '') vals.push(Number(s.pctFlash));
      if (vals.length === 0) continue;
      avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    } else {
      if (!findLeiSecaForTopic(key)) continue; // so entram topicos com lei seca mapeada
      if (!s.leiSecaFlashFeitos || s.leiSecaFlashAcertos === null || s.leiSecaFlashAcertos === undefined || s.leiSecaFlashFeitos <= 0) continue;
      avg = (s.leiSecaFlashAcertos / s.leiSecaFlashFeitos) * 100;
    }
    const threshold = t.alta_incidencia ? 90 : 75;
    const gap = threshold - avg;
    rows.push({ key, t, avg, threshold, gap, questoes: kind === 'assunto' ? (s.questoesFeitas || 0) : (s.leiSecaFlashFeitos || 0) });
  }
  rows.sort((a, b) => b.gap - a.gap);
  return rows;
}

function renderRevisaoSection(title, rows, noteEmpty, countLabel) {
  const precisa = rows.filter(r => r.gap > 0);
  const ok = rows.filter(r => r.gap <= 0);

  let html = '<div class="section-title">' + title + '</div>';
  html += '<div class="progress-summary">' +
    '<div class="progress-chip"><b>' + rows.length + '</b>' + countLabel + '</div>' +
    '<div class="progress-chip"><b>' + precisa.length + '</b>precisando de revisão</div>' +
    '<div class="progress-chip"><b>' + ok.length + '</b>na meta</div>' +
    '</div>';

  html += '<div class="section-title" style="font-size:13px;margin-top:14px;">Precisa revisar (' + precisa.length + ')</div>';
  if (precisa.length === 0) {
    html += '<div class="small-note">' + noteEmpty + '</div>';
  }
  precisa.forEach(r => { html += revItemCard(r, false); });

  html += '<div class="section-title" style="font-size:13px;">Na meta (' + ok.length + ')</div>';
  ok.forEach(r => { html += revItemCard(r, true); });

  return html;
}

function renderRevisaoTab() {
  const rowsAssunto = buildRevisaoRows('assunto');
  const rowsLei = buildRevisaoRows('lei');

  let html = '<div class="info-box">' +
    'Média entre % de acerto em questões e % de acerto em flashcards, por tópico. ' +
    'Tópicos de <b>alta incidência</b> (aparecem na planilha de assuntos mais cobrados) precisam de <b>90%</b> de acerto; ' +
    'os demais (<b>padrão</b>) precisam de <b>75%</b>. Abaixo da meta = precisa revisar. ' +
    'Dividido em conteúdo do PDF (assunto) e lei seca.' +
    '</div>';

  html += renderRevisaoSection(
    'Assunto (conteúdo do PDF)', rowsAssunto,
    'Nenhum tópico com dados abaixo da meta no momento — ou você ainda não lançou estatísticas. Preencha em Questões & Flashcards.',
    'tópicos com dados'
  );
  html += renderRevisaoSection(
    'Lei Seca', rowsLei,
    'Nenhum tópico de lei seca com dados abaixo da meta no momento — ou você ainda não lançou estatísticas. Preencha na aba Lei Seca.',
    'tópicos com dados'
  );

  document.getElementById('view-revisao').innerHTML = html;
}

function revItemCard(r, isOk) {
  const pct = Math.max(0, Math.min(100, r.avg));
  const tagCls = r.t.alta_incidencia ? 'badge-inc' : '';
  const incTxt = r.t.alta_incidencia ? ('&#9733; ' + r.t.pct + '% de incidência') : 'assunto padrão';
  return '<div class="rev-list-item' + (isOk ? ' ok' : '') + '">' +
    '<div class="rtitle">' + r.t.materia + ' — ' + r.t.label + '</div>' +
    '<div class="rmeta">' + incTxt + ' · meta ' + r.threshold + '% · média atual ' + r.avg.toFixed(0) + '% · ' + r.questoes + ' questões registradas</div>' +
    '<div class="rbar"><div class="rbar-fill" style="width:' + pct + '%;"></div></div>' +
  '</div>';
}

// ============================================================
// TABS + boot
// ============================================================
function showTab(name) {
  ['cronograma', 'questoes', 'lei', 'revisao'].forEach(n => {
    document.getElementById('view-' + n).classList.toggle('active', n === name);
    document.getElementById('tab-btn-' + n).classList.toggle('active', n === name);
  });
}

function renderAll() {
  renderCronogramaTab();
  renderQuestoesTab();
  renderLeiSecaTab();
  renderRevisaoTab();
}

document.getElementById('header-sub').textContent =
  DATA.meta.total_weeks + ' semanas · leitura ' + DATA.meta.leitura_flat_min + ' min/dia constante · ' +
  DATA.meta.total_content_pages.toLocaleString('pt-BR') + ' páginas de conteúdo no total';

// boot: renderiza com o que tem em cache local (resposta instantanea) e, em paralelo,
// busca a versao mais recente da nuvem — se vier algo, re-renderiza com os dados atualizados.
renderAll();
pullFromCloud().then(renderAll);

// ao voltar pra aba/app (ex: trocou de aparelho e voltou), busca de novo da nuvem
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !syncing) {
    pullFromCloud().then(renderAll);
  }
});
</script>
