<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma de Estudos — TJGO</title>
<style>
  :root {
    --navy: #16324f; --maroon: #8a1f2d; --gold: #c9a34e;
    --bg: #f7f5f0; --card: #ffffff; --border: #e0dcd0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: #222; margin: 0; padding: 0;
  }
  header {
    background: var(--navy); color: white; padding: 18px 24px;
    position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  nav.tabs { display: flex; gap: 4px; margin-top: 12px; }
  nav.tabs button {
    background: rgba(255,255,255,.12); border: none; color: white; padding: 8px 16px;
    border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  nav.tabs button.active { background: var(--bg); color: var(--navy); }
  .undo-btn {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: white;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    margin-top: 10px;
  }
  .undo-btn:hover { background: rgba(255,255,255,.22); }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
  .view { display: none; }
  .view.active { display: block; }

  .info-box {
    background: #fff; border-left: 4px solid var(--maroon); padding: 12px 16px;
    margin-bottom: 18px; font-size: 13px; border-radius: 4px; line-height: 1.5;
  }
  .progress-summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .progress-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; min-width: 110px;
  }
  .progress-chip b { display: block; color: var(--navy); font-size: 15px; }

  .week-block { margin-bottom: 22px; }
  .week-header {
    background: #e8e2d4; color: var(--navy); font-weight: 700; padding: 6px 12px;
    border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .day-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  .day-card.today { border-color: var(--maroon); box-shadow: 0 0 0 2px rgba(138,31,45,.15); }
  .day-head {
    background: #fbf9f4; padding: 6px 12px; font-weight: 700; color: var(--maroon);
    font-size: 12.5px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);
  }
  .item-row { padding: 10px 12px; border-bottom: 1px solid #f0ede4; }
  .item-row:last-child { border-bottom: none; }
  .item-row.done { background: #f3f8f2; }
  .item-row.review-row { background: #fbf6ea; }
  .item-row.leiseca-row { background: #f4f1ea; }
  .item-materia .ltag {
    background: var(--gold); color: #3a2c00; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 6px; vertical-align: middle;
  }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .item-materia { font-weight: 700; color: var(--navy); font-size: 13px; }
  .item-materia .rtag {
    background: var(--maroon); color: white; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 6px; vertical-align: middle;
  }
  .item-desc { font-size: 12.5px; margin-top: 3px; color: #333; }
  .badge-inc {
    background: #e4edf3; color: var(--navy); font-size: 10px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-left: 4px; white-space: nowrap;
  }
  .badge-lei {
    background: #f4f1ea; border-left: 3px solid var(--maroon); font-size: 10.5px; color: #5a4632;
    padding: 4px 8px; margin-top: 5px; border-radius: 3px;
  }
  .badge-lei b { color: var(--maroon); }
  .rev-piece { font-size: 11.5px; color: #444; margin-top: 3px; }
  .rev-piece .rtag2 {
    background: var(--gold); color: #3a2c00; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 8px; margin-right: 4px;
  }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .actions button {
    border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 9px;
    font-size: 11px; cursor: pointer; font-weight: 600;
  }
  .actions button.done-btn.active { background: #2e7d32; color: white; border-color: #2e7d32; }
  .actions button.skip-btn.active { background: var(--maroon); color: white; border-color: var(--maroon); }
  .actions button.prior-btn { border-radius: 50%; width: 26px; height: 26px; padding: 0;
    font-size: 13px; line-height: 1; color: #999; }
  .actions button.prior-btn:hover { border-color: #6b8e5a; color: #6b8e5a; }
  .prior-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:8px 12px; border-bottom:1px solid var(--line); }
  .prior-row .p-desc { font-size:12px; }
  .prior-row .p-mat { font-weight:600; font-size:11px; color:var(--maroon); }

  .stats-form { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; align-items: flex-end; }
  .stats-form label { font-size: 10.5px; color: #666; display: flex; flex-direction: column; gap: 2px; }
  .stats-form input {
    width: 64px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
  }
  .stats-form .pct-auto {
    width: 64px; padding: 4px 6px; border: 1px dashed var(--border); border-radius: 4px; font-size: 12px;
    background: #f6f4ee; color: #555; text-align: center;
  }
  .stats-form .lei-box {
    flex-basis: 100%; background: #f4f1ea; border-left: 3px solid var(--maroon); font-size: 10.5px;
    color: #5a4632; padding: 5px 8px; border-radius: 3px; margin-top: 2px;
  }
  .stats-form .lei-box b { color: var(--maroon); }

  .empty-day { padding: 14px; font-size: 12px; font-style: italic; color: #999; }

  /* aba questoes & flashcards */
  .subject-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 16px; overflow: hidden;
  }
  .subject-head {
    background: var(--navy); color: white; padding: 8px 14px; font-weight: 700; font-size: 13.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .subject-head .cnt { font-weight: 400; font-size: 11px; opacity: .85; }
  .topic-row {
    padding: 9px 14px; border-bottom: 1px solid #f0ede4; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px; flex-wrap: wrap;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row .tlabel { font-size: 12.5px; font-weight: 600; color: #333; flex: 1; min-width: 160px; }
  .topic-row .tlabel .badge-inc { margin-left: 6px; }

  /* aba revisao */
  .rev-list-item {
    background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--maroon);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px;
  }
  .rev-list-item.ok { border-left-color: #2e7d32; opacity: .75; }
  .rev-list-item .rtitle { font-weight: 700; color: var(--navy); font-size: 13.5px; }
  .rev-list-item .rmeta { font-size: 11px; color: #666; margin-top: 2px; }
  .rev-list-item .rbar { height: 6px; border-radius: 3px; background: #eee; margin-top: 6px; overflow: hidden; }
  .rev-list-item .rbar-fill { height: 100%; background: var(--maroon); }
  .rev-list-item.ok .rbar-fill { background: #2e7d32; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--navy); margin: 22px 0 8px; }
  .small-note { font-size: 11.5px; color: #777; margin-bottom: 10px; }

  table.simple { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
  table.simple th { background: var(--navy); color: white; text-align: left; padding: 5px 8px; font-size: 11px; }
  table.simple td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  table.simple tr:nth-child(even) td { background: #faf8f3; }

  .footer-note { text-align: center; font-size: 11px; color: #999; margin-top: 30px; }
  .reset-btn {
    background: none; border: 1px solid var(--border); color: #999; font-size: 10px;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }

  .chunk-line { display:flex; align-items:flex-start; gap:6px; margin-top:3px; }
  .chunk-line .ctext { flex:1; }
  button.prior-btn { border-radius:50%; width:17px; height:17px; min-width:17px; padding:0;
    font-size:9px; line-height:15px; color:#bbb; border:1px solid var(--line);
    background:#fff; cursor:pointer; margin-top:1px; }
  button.prior-btn:hover { border-color:#6b8e5a; color:#6b8e5a; background:#f2f7ef; }
  .upto-box { color:#aaa; font-size:10px; white-space:nowrap; }
  .upto-box input { width:38px; padding:1px 3px; font-size:10px; border:1px solid var(--line);
    border-radius:3px; text-align:center; font-family:inherit; }
  .adv-box { display:flex; align-items:center; gap:4px; font-size:10px; color:#888; }
  .adv-box input { width:42px; padding:2px 4px; font-size:11px; border:1px solid var(--line);
    border-radius:4px; text-align:center; font-family:inherit; }
  .prior-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:8px 12px; border-bottom:1px solid var(--line); }
  .prior-row .p-desc { font-size:12px; }
  .prior-row .p-mat { font-weight:600; font-size:11px; color:var(--maroon); }
</style>
</head>
<body>

<header>
  <h1>Cronograma de Estudos — TJGO</h1>
  <div class="sub" id="header-sub"></div>
  <nav class="tabs">
    <button id="tab-btn-cronograma" class="active" onclick="showTab('cronograma')">Cronograma</button>
    <button id="tab-btn-prior" onclick="showTab('prior')">Conteúdo já estudado no outro material</button>
  </nav>
  <button class="undo-btn" onclick="undoLast()" title="Desfaz a última ação">&#8630; Desfazer última ação</button>
</header>

<main>
  <div id="view-cronograma" class="view active"></div>
  <div id="view-prior" class="view"></div>
  <div class="footer-note">
    Progresso sincronizado na nuvem (Firebase) — funciona em qualquer aparelho.
    <span id="sync-status" style="margin-left:6px;"></span>
    <button class="reset-btn" onclick="resetAll()">Zerar progresso salvo</button>
  </div>
</main>

 60, "subjects": ["Direito Penal", "Direito Processual Civil"]}, {"semana": 29, "dia_nome": "Domingo", "data": "14/03", "leitura_min": 105, "questoes_min": 60, "subjects": ["Direito Processual Penal", "Português"]}, {"semana": 29, "dia_nome": "Segunda", "data": "15/03", "leitura_min": 105, "questoes_min": 60, "subjects": ["Direito Civil", "Direito Constitucional"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('tracker-data-json').textContent);
const SUBJ = DATA.subjects;
const DAYS = DATA.days;
const PACE = 18;

let EXTENDED_DAYS = DAYS.slice();
const WEEK_DAY_NAMES = ["Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo", "Segunda"];
const CAL_START = new Date(2026, 7, 25);

function ensureDay(idx) {
  while (EXTENDED_DAYS.length <= idx) {
    const i = EXTENDED_DAYS.length;
    const d = new Date(CAL_START.getTime()); d.setDate(d.getDate() + i);
    EXTENDED_DAYS.push({ semana: Math.floor(i/7)+1, dia_nome: WEEK_DAY_NAMES[i % 7],
      data: String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'),
      leitura_min: 0, questoes_min: 0, subjects: [] });
  }
}

const LS = {done:'tjgo3_done', skip:'tjgo3_skip', rdone:'tjgo3_rdone', rskip:'tjgo3_rskip',
            prior:'tjgo3_prior', extra:'tjgo3_extra'};
function loadLS(k, f){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):f;}catch(e){return f;} }
function saveLS(k, v){ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} }

let doneIds     = new Set(loadLS(LS.done, []));
let skipCount   = loadLS(LS.skip, {});
let revDoneIds  = new Set(loadLS(LS.rdone, []));
let revSkipCount= loadLS(LS.rskip, {});
// {aulaId: {upTo:N, from:dayIdx}} — "ja estudei esta aula ate a pagina N pelo material
// antigo". As paginas 1..N sao puladas A PARTIR do dia `from` (dias anteriores nao mudam),
// e o restante da aula (N+1 em diante) CONTINUA no cronograma. Se N >= total da aula,
// ela sai inteira. Assim da pra mesclar os dois materiais aula a aula.
let priorPages  = loadLS(LS.prior, {});
let extraPages  = loadLS(LS.extra, {});            // "<dayIdx>|<materia_key>" -> paginas adiantadas

const FIREBASE_DB_URL = 'https://cronograma-tjgo-default-rtdb.firebaseio.com';
const SYNC_URL = FIREBASE_DB_URL + '/progress/tjgo_gabriel_v3.json';
let syncTimer=null, syncing=false;
function setSyncStatus(t){ const e=document.getElementById('sync-status'); if(e) e.textContent=t; }
function collectState(){ return {doneIds:Array.from(doneIds), skipCount,
  revDoneIds:Array.from(revDoneIds), revSkipCount, priorPages,
  extraPages, updatedAt:Date.now()}; }
function applyState(s){ if(!s) return;
  doneIds=new Set(s.doneIds||[]); skipCount=s.skipCount||{};
  revDoneIds=new Set(s.revDoneIds||[]); revSkipCount=s.revSkipCount||{};
  priorPages=s.priorPages||{}; extraPages=s.extraPages||{};
  persistAll(false); }
function persistAll(sync){
  saveLS(LS.done,Array.from(doneIds)); saveLS(LS.skip,skipCount);
  saveLS(LS.rdone,Array.from(revDoneIds)); saveLS(LS.rskip,revSkipCount);
  saveLS(LS.prior,priorPages); saveLS(LS.extra,extraPages);
  if(sync!==false) scheduleCloudSync(); }
function scheduleCloudSync(){ setSyncStatus('salvando…'); clearTimeout(syncTimer);
  syncTimer=setTimeout(pushToCloud,700); }
function pushToCloud(){ syncing=true;
  fetch(SYNC_URL,{method:'PUT',body:JSON.stringify(collectState())})
    .then(r=>{if(!r.ok)throw 0; setSyncStatus('sincronizado ✓');})
    .catch(()=>setSyncStatus('sem conexão — salvo só neste aparelho'))
    .finally(()=>{syncing=false;}); }
function pullFromCloud(){ setSyncStatus('carregando da nuvem…');
  return fetch(SYNC_URL).then(r=>r.ok?r.json():null)
    .then(x=>{ if(x) applyState(x); setSyncStatus('sincronizado ✓'); })
    .catch(()=>setSyncStatus('sem conexão — usando dados deste aparelho')); }

function resetAll(){
  if(!confirm('Isso apaga todo o progresso marcado, neste navegador E na nuvem. Confirmar?')) return;
  for(const k in LS) localStorage.removeItem(LS[k]);
  doneIds=new Set(); skipCount={}; revDoneIds=new Set(); revSkipCount={};
  priorPages={}; extraPages={}; undoStack=[];
  clearTimeout(syncTimer); pushToCloud(); renderAll();
}

let undoStack=[];
function pushUndo(e){ undoStack.push(e); if(undoStack.length>60) undoStack.shift(); }
function undoLast(){
  const l=undoStack.pop();
  if(!l){ alert('Não há nenhuma ação para desfazer.'); return; }
  if(l.kind==='prior'){ if(l.prev===undefined) delete priorPages[l.id]; else priorPages[l.id]=l.prev; }
  else if(l.kind==='extra'){ if(l.prev) extraPages[l.key]=l.prev; else delete extraPages[l.key]; }
  else if(l.kind==='done'){ const s=l.track?revDoneIds:doneIds;
    if(s.has(l.id)) s.delete(l.id); else s.add(l.id); }
  else { const m=l.track?revSkipCount:skipCount; m[l.id]=Math.max(0,(m[l.id]||0)-1); }
  persistAll(); renderAll();
}

// ============================================================
// ALOCACAO DINAMICA — as paginas de cada dia sao CALCULADAS agora, nao fixadas na geracao.
// Assim, marcar uma aula como "ja estudei pelo outro material" ou adiantar paginas
// recalcula automaticamente todos os dias seguintes daquela materia.
// ============================================================
function fmtP(a,b){ return a===b ? 'p.'+a : 'p.'+a+'–'+b; }
function fmtH(m){ m=Math.round(m); const h=Math.floor(m/60), r=m%60;
  if(h&&r) return h+'h'+String(r).padStart(2,'0'); return h?h+'h':r+'min'; }

function slotsOf(mk){ const o=[]; DAYS.forEach((d,i)=>{ if(d.subjects.indexOf(mk)>=0) o.push(i); }); return o; }

function allocate(){
  const alloc = DAYS.map(()=>[]);           // itens de estudo por dia
  const revCand = DAYS.map(()=>[]);         // candidatos a revisao por dia
  for(const mk in SUBJ){
    const s=SUBJ[mk];
    const aulas=s.aulas;
    const slots=slotsOf(mk);
    let pos=0, off=0;
    const sessions=[];
    for(let k=0;k<slots.length;k++){
      const di=slots[k];
      let budget=s.pps + (Number(extraPages[di+'|'+mk])||0);
      const chunks=[];
      while(budget>0.4 && pos<aulas.length){
        const a=aulas[pos];
        const pr=priorPages[a.id];
        if(pr && di>=pr.from && off < pr.upTo){
          off = Math.min(pr.upTo, a.pages);          // pula o que ja foi visto no outro material
          if(off >= a.pages-0.4){ pos++; off=0; continue; }
        }
        const avail=a.pages-off;
        const take=Math.min(avail,budget);
        if(take<=0.4) break;
        const start=Math.round(off)+1;
        off+=take; budget-=take;
        const concl = off >= a.pages-0.4;
        const end=Math.min(a.pages, Math.round(off));
        chunks.push({aulaId:a.id, nome:a.nome, start:start, end:end, concl:concl});
        if(concl){ pos++; off=0; }
      }
      if(chunks.length) sessions.push({dayIdx:di, chunks:chunks});
    }
    const dsc = ss => ss.chunks.map(c=>c.nome+' ('+fmtP(c.start,c.end)+')'+(c.concl?' — concl.':'')).join('; ');
    sessions.forEach((ss,si)=>{
      const pages=ss.chunks.reduce((t,c)=>t+(c.end-c.start+1),0);
      alloc[ss.dayIdx].push({ id:'s_'+ss.dayIdx+'_'+mk, materia:s.short, materia_key:mk,
        dayIdx:ss.dayIdx, desc:dsc(ss), chunks:ss.chunks, minutos:Math.round(pages/PACE*60) });
      const revs=[];
      if(si-1>=0) revs.push({tipo:'última sessão', desc:dsc(sessions[si-1])});
      if(si-2>=0) revs.push({tipo:'~1 semana',    desc:dsc(sessions[si-2])});
      if(si-8>=0) revs.push({tipo:'~1 mês',       desc:dsc(sessions[si-8])});
      if(revs.length) revCand[ss.dayIdx].push({ id:'r_'+ss.dayIdx+'_'+mk,
        materia:s.short, materia_key:mk, revs:revs });
    });
  }
  // no maximo 1 revisao nativa por dia (alterna entre as 2 materias do dia)
  const revNative = revCand.map((list,i)=>{
    if(!list.length) return [];
    if(list.length===1) return [list[0]];
    return [ list[i % list.length] ];
  });
  return { alloc, revNative };
}

// esteira/fila: "nao estudei" adia e CONSOME a vaga do dia (nunca faz nada retroceder)
function simulateTrack(getItems, skipMap, capacity){
  let carry=[]; const rt={}; const out=[]; let i=0;
  while(i < DAYS.length || carry.length){
    if(i >= DAYS.length + 400) break;
    ensureDay(i);
    const pool = carry.concat(getItems(i) || []);
    const shown=[], defer=[], over=[]; let used=0;
    for(const it of pool){
      if(used>=capacity){ over.push(it); continue; }
      const sc=skipMap[it.id]||0, rd=rt[it.id]||0;
      if(rd<sc){ rt[it.id]=rd+1; defer.push(it); } else { shown.push(it); }
      used++;
    }
    out.push(shown); carry=defer.concat(over); i++;
  }
  return out;
}

function getSimulated(){
  const {alloc, revNative} = allocate();
  const studyByDay = simulateTrack(i=>alloc[i], skipCount, 2);
  const revByDay   = simulateTrack(i=>revNative[i], revSkipCount, 1);
  return {studyByDay, revByDay};
}

// ============================================================
// ACOES
// ============================================================
function toggleDone(id, track){
  const s = track ? revDoneIds : doneIds;
  if(s.has(id)) s.delete(id); else s.add(id);
  pushUndo({kind:'done', track:!!track, id}); persistAll(); renderAll();
}
function bumpSkip(id, track){
  const m = track ? revSkipCount : skipCount;
  m[id]=(m[id]||0)+1;
  pushUndo({kind:'skip', track:!!track, id}); persistAll(); renderAll();
}
// A bolinha ACUMULA (nao e liga/desliga): cada clique empurra a marca ate o fim do
// trecho exibido. Assim da pra ir marcando trecho a trecho — 1-13, depois 14-26 etc —
// sem que o clique seguinte desfaca o anterior. Para desmarcar, use a caixinha (0),
// o botao "Devolver ao cronograma" na aba, ou o Desfazer.
function markPrior(aulaId, dayIdx, upTo){
  const prev=priorPages[aulaId];
  const n=Number(upTo)||0;
  const cur=prev?prev.upTo:0;
  if(n<=cur) return;                       // ja estava marcado ate essa pagina
  priorPages[aulaId]={upTo:n, from:(prev?prev.from:dayIdx)};
  pushUndo({kind:'prior', id:aulaId, prev}); persistAll(); renderAll();
}
function clearPrior(aulaId){
  const prev=priorPages[aulaId];
  if(prev===undefined) return;
  delete priorPages[aulaId];
  pushUndo({kind:'prior', id:aulaId, prev}); persistAll(); renderAll();
}
function setPriorUpTo(aulaId, dayIdx, val){
  const prev=priorPages[aulaId];
  const n=Math.max(0, Math.round(Number(val)||0));
  if(n>0) priorPages[aulaId]={upTo:n, from:(prev?prev.from:dayIdx)};
  else delete priorPages[aulaId];
  pushUndo({kind:'prior', id:aulaId, prev}); persistAll(); renderAll();
}
function setExtra(dayIdx, mk, val){
  const key=dayIdx+'|'+mk;
  const prev=extraPages[key];
  const n=Math.max(0, Math.round(Number(val)||0));
  if(n) extraPages[key]=n; else delete extraPages[key];
  pushUndo({kind:'extra', key, prev}); persistAll(); renderAll();
}

// ============================================================
// RENDER
// ============================================================
const REV_LABEL={'última sessão':'D-recente','~1 semana':'D+7','~1 mês':'D+30'};
function todayStr(){ const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function studyItemHtml(item){
  const isDone=doneIds.has(item.id);
  const min = item.minutos ? ' <span style="font-weight:400;color:#888;font-size:10px;">('+fmtH(item.minutos)+')</span>' : '';
  let chunksHtml='';
  item.chunks.forEach(c=>{
    const pr=priorPages[c.aulaId];
    chunksHtml += '<div class="chunk-line">' +
      '<button class="prior-btn" onclick="markPrior(\'' + c.aulaId + '\',' + item.dayIdx + ',' + c.end + ')" ' +
      'title="Já estudei este trecho pelo material antigo (até a p.' + c.end + ') — o resto da aula continua no cronograma">&#9711;</button>' +
      '<span class="ctext">' + esc(c.nome) + ' (' + fmtP(c.start,c.end) + ')' +
      (c.concl ? ' <span style="color:#6b8e5a;">— concl.</span>' : '') +
      '<span class="upto-box" title="Já estudei esta aula, no material antigo, até a página...">' +
        ' · outro material até p.<input type="number" min="0" step="1" placeholder="0" value="' +
        (pr ? pr.upTo : '') + '" onchange="setPriorUpTo(\'' + c.aulaId + '\',' + item.dayIdx + ',this.value)">' +
      '</span>' +
      '</span></div>';
  });
  const key=item.dayIdx+'|'+item.materia_key;
  const adv=extraPages[key]||'';
  return '<div class="item-row'+(isDone?' done':'')+'">'+
    '<div class="item-top"><div style="flex:1;">'+
      '<span class="item-materia">'+item.materia+min+'</span>'+
      '<div class="item-desc">'+chunksHtml+'</div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="done-btn'+(isDone?' active':'')+'" onclick="toggleDone(\''+item.id+'\',false)">&#10003; Estudei</button>'+
      '<button class="skip-btn" onclick="bumpSkip(\''+item.id+'\',false)" title="Adia para o próximo dia">&#10007; Não estudei</button>'+
      '<span class="adv-box" title="Adiantar páginas: soma páginas a este dia e reorganiza os próximos">adiantar +'+
        '<input type="number" min="0" step="1" value="'+adv+'" placeholder="0" '+
        'onchange="setExtra('+item.dayIdx+',\''+item.materia_key+'\',this.value)"> pág.</span>'+
    '</div></div></div>';
}

function reviewItemHtml(item){
  const isDone=revDoneIds.has(item.id);
  const pieces=item.revs.map(r=>'<div style="margin-top:2px;"><span class="badge-rev">'+
    (REV_LABEL[r.tipo]||r.tipo)+'</span> '+esc(r.desc)+'</div>').join('');
  return '<div class="item-row rev'+(isDone?' done':'')+'">'+
    '<div class="item-top"><div style="flex:1;">'+
      '<span class="item-materia">'+item.materia+' <span class="badge-tag">revisão</span></span>'+
      '<div class="item-desc">'+pieces+'</div>'+
    '</div><div class="actions">'+
      '<button class="done-btn'+(isDone?' active':'')+'" onclick="toggleDone(\''+item.id+'\',true)">&#10003; Revisei</button>'+
      '<button class="skip-btn" onclick="bumpSkip(\''+item.id+'\',true)" title="Adia esta revisão">&#10007; Não revisei</button>'+
    '</div></div></div>';
}

function renderCronogramaTab(){
  const {studyByDay, revByDay}=getSimulated();
  const today=todayStr();
  const n=Math.max(studyByDay.length, revByDay.length);
  let html='';
  for(let i=0;i<n;i++){
    ensureDay(i);
    const day=EXTENDED_DAYS[i];
    const st=studyByDay[i]||[], rv=revByDay[i]||[];
    if(!st.length && !rv.length && i>=DAYS.length) continue;
    const isToday = day.data===today;
    let body='';
    if(!st.length && !rv.length) body='<div class="empty-day">Sem sessão neste dia</div>';
    else { st.forEach(x=>body+=studyItemHtml(x)); rv.forEach(x=>body+=reviewItemHtml(x)); }
    const mins = st.reduce((t,x)=>t+(x.minutos||0),0);
    html += '<div class="day-card'+(isToday?' today':'')+'">'+
      '<div class="day-head"><span>'+day.dia_nome+' — '+day.data+(isToday?' (hoje)':'')+'</span>'+
      '<span style="font-weight:400;">Leitura '+fmtH(mins)+' · Questões '+fmtH(day.questoes_min||0)+'</span></div>'+
      body+'</div>';
  }
  document.getElementById('view-cronograma').innerHTML=html;
}

function renderPriorTab(){
  const byId={};
  for(const mk in SUBJ) SUBJ[mk].aulas.forEach(a=>{ byId[a.id]={a, mk}; });
  const list=Object.keys(priorPages).map(id=>byId[id]).filter(Boolean);
  let html='';
  if(!list.length){
    html='<div class="day-card"><div class="empty-day">Nada marcado ainda. Use a bolinha (&#9711;) '+
         'ao lado de um conteúdo no cronograma para marcar que você já o estudou pelo material antigo.</div></div>';
  } else {
    const byMat={};
    list.forEach(x=>{ const s=SUBJ[x.mk].short; (byMat[s]=byMat[s]||[]).push(x); });
    for(const mat in byMat){
      html+='<div class="day-card"><div class="day-head"><span>'+mat+'</span>'+
            '<span style="font-weight:400;">'+byMat[mat].length+' aula(s) · '+
            byMat[mat].reduce((t,x)=>t+x.a.pages,0)+' páginas economizadas</span></div>';
      byMat[mat].forEach(x=>{
        html+='<div class="prior-row"><div><div class="p-mat">'+mat+'</div>'+
              '<div class="p-desc">'+esc(x.a.nome)+' — já estudado no outro material até a <b>p.'+
              priorPages[x.a.id].upTo+'</b> (de '+x.a.pages+')'+
              (priorPages[x.a.id].upTo>=x.a.pages ? ' · aula inteira' :
               ' · restam '+(x.a.pages-priorPages[x.a.id].upTo)+' p. no cronograma')+'</div></div>'+
              '<button class="skip-btn" onclick="clearPrior(\''+x.a.id+'\')" '+
              'title="Devolve esta aula para o cronograma">&#8630; Devolver ao cronograma</button></div>';
      });
      html+='</div>';
    }
  }
  document.getElementById('view-prior').innerHTML=html;
}

function showTab(name){
  ['cronograma','prior'].forEach(n=>{
    document.getElementById('view-'+n).classList.toggle('active', n===name);
    document.getElementById('tab-btn-'+n).classList.toggle('active', n===name);
  });
}

function renderAll(){
  renderCronogramaTab();
  renderPriorTab();
  let tot=0, rest=0;
  for(const mk in SUBJ){ SUBJ[mk].aulas.forEach(a=>{ tot+=a.pages; const pr=priorPages[a.id];
    rest += pr ? Math.max(0, a.pages-pr.upTo) : a.pages; }); }
  document.getElementById('header-sub').textContent =
    DAYS.length+' dias · '+rest.toLocaleString('pt-BR')+' páginas restantes'+
    (rest<tot ? ' (de '+tot.toLocaleString('pt-BR')+')' : '');
}

renderAll();
pullFromCloud().then(renderAll);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && !syncing) pullFromCloud().then(renderAll);
});
</script>
</body>
</html>
